name: Public document boundary
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m unittest discover -s .github/tests -p 'test_public_hygiene.py'
      - run: python .github/scripts/check_public_hygiene.py
