name: Gemma template contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  template-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ./jang-tools
      - run: python -m unittest discover -s jang-tools/tests -p gemma4_chat_template_test.py
        env:
          PYTHONPATH: jang-tools
