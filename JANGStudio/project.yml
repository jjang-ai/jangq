# JANGStudio/project.yml
name: JANGStudio
options:
  deploymentTarget:
    macOS: "15.0"
  bundleIdPrefix: ai.jangq
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  JANGRuntime:
    path: ../jang-runtime
targets:
  JANGStudio:
    type: application
    platform: macOS
    sources:
      - path: JANGStudio
    resources:
      - path: JANGStudio/Resources/Assets.xcassets
        optional: true
    info:
      path: JANGStudio/Resources/Info.plist
      properties:
        CFBundleName: JANG Studio
        CFBundleDisplayName: JANG Studio
        CFBundleIdentifier: ai.jangq.JANGStudio
        LSMinimumSystemVersion: "15.0"
        NSHighResolutionCapable: YES
    entitlements:
      path: JANGStudio/Resources/JANGStudio.entitlements
      properties:
        com.apple.security.cs.allow-jit: false
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.files.user-selected.read-write: true
    dependencies:
      - package: JANGRuntime
        product: JANGKit
      - package: JANGRuntime
        product: JANGExpertLab
    postCompileScripts:
      - script: |
          set -e
          SRC="$SRCROOT/build/python"
          DST="$CODESIGNING_FOLDER_PATH/Contents/Resources/python"
          if [ ! -d "$SRC" ]; then
            echo "warning: Python bundle missing at $SRC. Run Scripts/build-python-bundle.sh once."
            exit 0
          fi
          LOCAL_JANG="$SRCROOT/../jang-tools/jang_tools"
          BUNDLE_JANG="$SRC/lib/python3.11/site-packages/jang_tools"
          if [ -d "$LOCAL_JANG" ] && [ -d "$BUNDLE_JANG" ]; then
            rsync -a --delete "$LOCAL_JANG/" "$BUNDLE_JANG/"
            echo "note: Refreshed bundled jang_tools from $LOCAL_JANG"
          fi
          mkdir -p "$DST"
          rsync -a --delete "$SRC/" "$DST/"
          echo "note: Embedded Python bundle copied to $DST"
        name: "Embed Python Bundle"
    scheme:
      testTargets: [JANGStudioTests]
      gatherCoverageData: true
  JANGStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/JANGStudioTests
        excludes:
          - "Fixtures/**"
      - path: Tests/JANGStudioTests/Fixtures/fake_convert.sh
        buildPhase: resources
      - path: Tests/JANGStudioTests/Fixtures/golden_convert_events.jsonl
        buildPhase: resources
      - path: Tests/JANGStudioTests/Fixtures/good_output
        buildPhase: resources
        type: folder
      - path: Tests/JANGStudioTests/Fixtures/broken_output
        buildPhase: resources
        type: folder
    dependencies: [{target: JANGStudio}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
  JANGStudioUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/JANGStudioUITests
      - path: Tests/JANGStudioTests/Fixtures/fake_convert.sh
        buildPhase: resources
    dependencies: [{target: JANGStudio}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: NO
